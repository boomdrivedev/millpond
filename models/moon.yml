$schema: 'https://moonrepo.dev/schemas/project.json'

# millpond's design models, in Allium, beside the code they describe:
# seams/ holds millpond's side of the seams between the family's tools,
# what it reads of others' records and what it asks of them. Allium has no
# formatter, lint or test of its own; its checker is the one check, in the
# fast tier, run by the allium devenv.nix pins.
language: 'allium'
layer: 'configuration'

tasks:
  # Each model parses and holds the language's structural rules: every
  # status has a way out, every declared transition has a rule, and no
  # rule makes a transition the model does not declare. A warning fails it.
  typecheck:
    command: 'allium check models'
    inputs: ['**/*.allium', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
