$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it.
  # Its key names only files the tree holds as it holds them, as sluice's
  # check of a candidate's key reads them: moon globs a root task's inputs
  # on the disk, past .gitignore, so they leave out each path .gitignore
  # names, as Boomdrive Cloud's root:format does (its fdb4248).
  format:
    command: 'treefmt --ci'
    inputs:
      - '/**/*'
      - '!/.devenv/**/*'
      - '!/.devenv.flake.nix'
      - '!/devenv.local.nix'
      - '!/.pre-commit-config.yaml'
      - '!/.moon/cache/**/*'
      - '!/result'
      - '!/result/**/*'
      - '!/site/node_modules/**/*'
      - '!/site/dist/**/*'
      - '!/site/.astro/**/*'
      - '!/target/**/*'
      - '!/**/.DS_Store'
      - '!/site/shots/**/*'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The README's prose, through Vale (.vale.ini, styles/Millpond). The
  # site's pages are the site's own (site:prose).
  prose:
    command: 'vale README.md'
    inputs: ['/README.md', '/.vale.ini', '/styles/**/*', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # A new place's first commit through the shared hooks, made before anyone
  # enters its shell (devenv.nix, `hooks`).
  hooks:
    command: 'hooks'
    inputs: ['/devenv.nix', '/devenv.yaml', '/devenv.lock', '/treefmt.nix', '/.versionrc']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
